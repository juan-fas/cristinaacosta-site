[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for hashed assets and fonts; HTML is always revalidated.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Alias domains send visitors to the primary domain so search engines see one site.
[[redirects]]
  from = "https://cristinaacostamortgageteam.ca/*"
  to = "https://cristinaacosta.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://juanacosta.ca/*"
  to = "https://cristinaacosta.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cristinamortgage.ca/*"
  to = "https://cristinaacosta.ca/:splat"
  status = 301
  force = true
